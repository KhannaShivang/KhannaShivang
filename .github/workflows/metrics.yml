name: Generate Profile Stats SVG

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually anytime
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/stats.svg
          committer_message: "chore: update profile stats [skip ci]"

          # --- theme: dark background + Spotify green accent ---
          config_timezone: Asia/Kolkata
          plugin_base: header, activity, community, repositories, metadata
          base: header, activity
          config_display: large
          config_theme: dark
          config_gradient: 0,191414,1DB954

          # --- plugins ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_achievements: yes
          plugin_achievements_threshold: C

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_stars: yes
          plugin_stars_limit: 0
